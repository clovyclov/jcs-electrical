  <style>
    .quiz-page {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 20px;
    }

    .quiz-wrap {
      width: 100%;
      max-width: 560px;
    }

    .quiz-intro {
      text-align: center;
      margin-bottom: 28px;
    }

    .quiz-eyebrow {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 10px;
    }

    .quiz-heading {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.05;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-wrap: balance;
    }

    .quiz-subhead {
      font-size: 16px;
      color: var(--text-muted);
    }

    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color-light);
      border-radius: var(--radius-md);
      padding: 32px;
      position: relative;
      overflow: hidden;
    }

    .quiz-progress-track {
      height: 6px;
      background: var(--bg-subtle);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .quiz-progress-fill {
      height: 100%;
      background: var(--accent-gold);
      border-radius: 4px;
      transition: width 0.35s ease;
      width: 33.3%;
    }

    .quiz-step-label {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .quiz-question {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 26px;
      line-height: 1.15;
      text-transform: uppercase;
      margin-bottom: 22px;
      color: var(--text-main);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 8px;
    }

    .quiz-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 600;
      padding: 16px 18px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: border-color var(--transition-fast), background var(--transition-fast), transform var(--transition-fast);
    }

    .quiz-option:hover {
      border-color: var(--accent-gold);
      background: var(--bg-card-hover);
      transform: translateX(2px);
    }

    .quiz-option-arrow {
      color: var(--accent-gold);
      font-size: 18px;
      flex-shrink: 0;
    }

    .quiz-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-top: 18px;
    }

    .quiz-back:hover {
      color: var(--accent-gold);
    }

    .quiz-contact-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .quiz-recap {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .quiz-recap b {
      color: var(--accent-gold);
    }

    .quiz-error {
      display: none;
      color: oklch(72% 0.19 25);
      font-size: 13px;
      font-weight: 600;
      margin-top: -6px;
    }

    .quiz-error.is-visible {
      display: block;
    }

    .quiz-trust-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-dim);
    }

    @media (max-width: 480px) {
      .quiz-card { padding: 24px 20px; }
      .quiz-question { font-size: 22px; }
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WF25S3V5"

  <!-- EMERGENCY TOP BANNER -->
  <div class="emergency-banner">
    <span class="emergency-dot"></span>
    <span>LICENSED LIGHTING &amp; OUTLET INSTALLERS — CALL NOW: <a href="tel:4256962234" style="color:inherit; text-decoration:underline;">(425) 696-2234</a></span>
  </div>

  <!-- SITE HEADER -->
  <header class="site-header">
    <div class="container header-container">
      <a href="../" class="logo">
        <span class="logo-icon"></span>
        JCS ELECTRICAL
      </a>
      <div class="header-actions">
        <a href="tel:4256962234" class="phone-link">(425) 696-2234</a>
      </div>
    </div>
  </header>

  <!-- QUIZ -->
  <main class="quiz-page container">
    <div class="quiz-wrap">
      <div class="quiz-intro">
        <div class="quiz-eyebrow">Free Instant Quote</div>
        <h1 class="quiz-heading">Answer 3 Quick Questions, Get Your Price Range</h1>
        <p class="quiz-subhead">Takes about 30 seconds. No obligation.</p>
      </div>

      <div class="quiz-card">
        <div class="quiz-progress-track">
          <div class="quiz-progress-fill" id="quizProgressFill"></div>
        </div>
        <div id="quizStepContainer"></div>
      </div>

      <div class="quiz-trust-row">
        <span>✓ Licensed &amp; Insured</span>
        <span>✓ 4.9★ Rated</span>
        <span>✓ No Spam, Ever</span>
      </div>
    </div>
  </main>

  <script src="../js/main.js"></script>

  <script>
    (function () {
      var answers = { service: '', timeline: '', name: '', phone: '', email: '' };
      var step = 1;
      var TOTAL_STEPS = 3;

      var container = document.getElementById('quizStepContainer');
      var progressFill = document.getElementById('quizProgressFill');

      var serviceOptions = [
        'Recessed / Can Lighting',
        'Ceiling Fan Installation',
        'Outlet or Switch Upgrade',
        'Not Sure — Just Need an Electrician'
      ];

      var timelineOptions = [
        'ASAP — This Week',
        'Within the Next Month',
        'Just Getting Quotes'
      ];

      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function setProgress() {
        progressFill.style.width = ((step - 1) / TOTAL_STEPS * 100 + 100 / TOTAL_STEPS) + '%';
      }

      function renderStep1() {
        step = 1;
        setProgress();
        var html = '' +
          '<div class="quiz-step-label">Step 1 of ' + TOTAL_STEPS + '</div>' +
          '<div class="quiz-question">What do you need help with?</div>' +
          '<div class="quiz-options" id="quizOptions"></div>';
        container.innerHTML = html;
        var optWrap = document.getElementById('quizOptions');
        serviceOptions.forEach(function (opt) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'quiz-option';
          btn.innerHTML = '<span>' + esc(opt) + '</span><span class="quiz-option-arrow">→</span>';
          btn.addEventListener('click', function () {
            answers.service = opt;
            renderStep2();
          });
          optWrap.appendChild(btn);
        });
      }

      function renderStep2() {
        step = 2;
        setProgress();
        var html = '' +
          '<div class="quiz-step-label">Step 2 of ' + TOTAL_STEPS + '</div>' +
          '<div class="quiz-question">How soon do you need this done?</div>' +
          '<div class="quiz-options" id="quizOptions"></div>' +
          '<button type="button" class="quiz-back" id="quizBack1">← Back</button>';
        container.innerHTML = html;
        var optWrap = document.getElementById('quizOptions');
        timelineOptions.forEach(function (opt) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'quiz-option';
          btn.innerHTML = '<span>' + esc(opt) + '</span><span class="quiz-option-arrow">→</span>';
          btn.addEventListener('click', function () {
            answers.timeline = opt;
            renderStep3();
          });
          optWrap.appendChild(btn);
        });
        document.getElementById('quizBack1').addEventListener('click', renderStep1);
      }

      function renderStep3() {
        step = 3;
        setProgress();
        var html = '' +
          '<div class="quiz-step-label">Step 3 of ' + TOTAL_STEPS + '</div>' +
          '<div class="quiz-question">Where should we send your quote?</div>' +
          '<div class="quiz-recap"><b>' + esc(answers.service) + '</b> · ' + esc(answers.timeline) + '</div>' +
          '<form class="quiz-contact-form" id="quizContactForm">' +
            '<input type="text" placeholder="Full Name" class="form-control" id="quizName">' +
            '<input type="tel" placeholder="Phone Number" class="form-control" id="quizPhone">' +
            '<input type="email" placeholder="Email Address (optional)" class="form-control" id="quizEmail">' +
            '<div class="quiz-error" id="quizError">Please enter your name and phone number.</div>' +
            '<button type="submit" class="btn-primary" style="width: 100%; margin-top: 4px;">Get My Free Quote</button>' +
          '</form>' +
          '<button type="button" class="quiz-back" id="quizBack2">← Back</button>';
        container.innerHTML = html;

        document.getElementById('quizBack2').addEventListener('click', renderStep2);
        document.getElementById('quizContactForm').addEventListener('submit', function (e) {
          e.preventDefault();
          var name = document.getElementById('quizName').value.trim();
          var phone = document.getElementById('quizPhone').value.trim();
          var email = document.getElementById('quizEmail').value.trim();
          var errorEl = document.getElementById('quizError');

          if (!name || !phone) {
            errorEl.classList.add('is-visible');
            return;
          }
          errorEl.classList.remove('is-visible');

          answers.name = name;
          answers.phone = phone;
          answers.email = email;

          submitQuiz();
        });
      }

      function submitQuiz() {
        var parts = answers.name.split(' ');
        var firstName = parts[0] || '';
        var lastName = parts.slice(1).join(' ') || '';
        var notes = 'Quiz answers — Service: ' + answers.service + ' | Timeline: ' + answers.timeline;

        var webhookPayload = {
          locationId: 'iDdhTAYwVIzsWgprAeiV',
          firstName: firstName,
          lastName: lastName,
          name: answers.name,
          email: answers.email,
          phone: answers.phone,
          service: answers.service,
          notes: notes,
          source: 'Website Quiz Lead Form (Test Page)',
          tags: ['Google-Ads-Lead', 'Website-Quiz-Lead'],
          customFields: [
            { id: '9zKDPiXPh3tePknC1S16', key: 'contact.service_needed', value: answers.service },
            { id: 'VneiQBZ00NJvcxZLx9Ei', key: 'contact.job_notes', value: notes }
          ]
        };

        var webhookUrl = 'https://services.leadconnectorhq.com/hooks/iDdhTAYwVIzsWgprAeiV/webhook-trigger/62a636e3-8991-4882-af16-4c08d0763081';

        var webhookPromise = fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(webhookPayload)
        }).catch(function (err) {
          console.warn('Webhook post note:', err);
        });

        Promise.all([webhookPromise]).finally(function () {
          window.location.href = '../thank-you/';
        });
      }

      renderStep1();
    })();
  </script>
